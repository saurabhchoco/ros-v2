<!DOCTYPE html>
<html>

<head>

  <title>
    R-OS Menu Management
  </title>

  <style>

    body {
      font-family: Arial;
      padding: 20px;
    }

    input,
    button,
    select {

      padding: 10px;
      margin: 5px;

    }

    .card {

      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 10px;

    }

  </style>

</head>

<body>

  <h1>
    Menu Management
  </h1>

  <h2>
    Create Category
  </h2>

  <input
    id="categoryName"
    placeholder="Category Name"
  />

  <button onclick="createCategory()">
    Create Category
  </button>

  <hr />

  <h2>
    Create Menu Item
  </h2>

  <input
    id="itemName"
    placeholder="Item Name"
  />

  <input
    id="itemPrice"
    placeholder="Price"
    type="number"
  />

  <select id="categorySelect">
  </select>

  <button onclick="createItem()">
    Create Item
  </button>

  <hr />

  <h2>
    Categories
  </h2>

  <div id="categories">
  </div>

  <h2>
    Menu Items
  </h2>

  <div id="items">
  </div>

  <script src="./js/config/config.js">
  </script>
  <script src="./js/session.js">
  </script>
  <script src="./js/menu/menu.js">
  </script>

</body>

</html>
